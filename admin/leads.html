<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mimba · Leads (staff)</title>
<style>
  :root {
    --ink: #2B2419; --ink-70: rgba(43,36,25,.70); --ink-50: rgba(43,36,25,.50); --ink-15: rgba(43,36,25,.15); --ink-08: rgba(43,36,25,.08);
    --campo: #4F6B2E; --campo-deep: #33461C; --campo-soft: #DEE7C9;
    --critico: #9B3226; --critico-soft: #F4DAD3;
    --areia: #F4EFE6; --pergaminho: #FCF9F3; --pergaminho2: #F8F3EA;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'DM Sans', -apple-system, sans-serif; background: var(--areia); color: var(--ink); }
  .shell { max-width: 960px; margin: 0 auto; padding: 32px 20px 60px; }
  .wordmark { font-weight: 800; font-size: 20px; letter-spacing: -.02em; margin-bottom: 4px; }
  .wordmark span { color: var(--campo); }
  .sub { color: var(--ink-50); font-size: 13px; margin-bottom: 28px; }

  #tela-login { max-width: 360px; margin: 80px auto; background: var(--pergaminho); border-radius: 16px; padding: 28px; box-shadow: 0 1px 1px rgba(43,36,25,.06), 0 14px 26px -12px rgba(43,36,25,.28); }
  #tela-login h1 { font-size: 17px; margin: 0 0 4px; }
  #tela-login p { color: var(--ink-50); font-size: 13px; margin: 0 0 18px; }
  input { width: 100%; padding: 11px 13px; border: 1px solid var(--ink-15); border-radius: 10px; font: 14px 'DM Sans', sans-serif; margin-bottom: 10px; background: #fff; color: var(--ink); }
  button { cursor: pointer; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; padding: 11px 16px; }
  .btn-primary { background: var(--campo); color: #fff; width: 100%; }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  #login-erro, #acesso-erro { display:none; color: var(--critico); background: var(--critico-soft); border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-top: 10px; }

  #tela-admin { display: none; }
  .topo { display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px; }
  .sair { background: transparent; color: var(--ink-70); border: 1px solid var(--ink-15); }
  .stats { display:flex; gap:14px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--pergaminho); border-radius: 12px; padding: 14px 18px; min-width: 120px; }
  .stat b { display:block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--ink-50); }

  table { width: 100%; border-collapse: collapse; background: var(--pergaminho); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(43,36,25,.09); }
  th, td { text-align: left; padding: 11px 14px; font-size: 13px; border-bottom: 1px solid var(--ink-08); }
  th { background: var(--pergaminho2); color: var(--ink-70); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  .tag { display:inline-block; background: var(--campo-soft); color: var(--campo-deep); border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .vazio, .carregando { text-align:center; color: var(--ink-50); padding: 40px 0; font-size: 14px; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="shell">
  <div class="wordmark">Mimba<span>.</span> admin</div>

  <div id="tela-login">
    <h1>Acesso restrito</h1>
    <p>Só staff Mimba entra aqui.</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-senha" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn-primary" id="btn-entrar" onclick="entrar()">Entrar</button>
    <div id="login-erro"></div>
  </div>

  <div id="tela-admin">
    <div class="topo">
      <div class="sub" style="margin:0">Leads da landing (mimba.com.br)</div>
      <button class="sair" onclick="sair()">Sair</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="stat-total">—</b><span>Total</span></div>
      <div class="stat"><b id="stat-7d">—</b><span>Últimos 7 dias</span></div>
    </div>
    <div class="table-wrap">
      <table id="tabela-leads" style="display:none">
        <thead><tr><th>Quando</th><th>Nome</th><th>Contato</th><th>Origem</th><th>Origem (marketing)</th></tr></thead>
        <tbody id="leads-body"></tbody>
      </table>
      <div class="carregando" id="carregando">Carregando…</div>
      <div class="vazio" id="vazio" style="display:none">Nenhum lead capturado ainda.</div>
      <div id="acesso-erro"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fmjfvfufkqswweyasjyp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtamZ2ZnVma3Fzd3dleWFzanlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTA1NzAsImV4cCI6MjA5MDQ2NjU3MH0.wKwB51Ug80T8cYML9Dh8GcbXc5pRxMQKrdK7Y49f7AU';
const SESSAO_KEY = 'mimba_admin_sessao';

function salvarSessao(auth) { try { sessionStorage.setItem(SESSAO_KEY, JSON.stringify(auth)); } catch(e){} }
function lerSessao() { try { return JSON.parse(sessionStorage.getItem(SESSAO_KEY) || 'null'); } catch(e){ return null; } }
function limparSessao() { try { sessionStorage.removeItem(SESSAO_KEY); } catch(e){} }

function mostrarErro(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

async function entrar() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erro = document.getElementById('login-erro');
  erro.style.display = 'none';
  if (!email || !senha) { mostrarErro('login-erro', 'Informe email e senha.'); return; }
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: senha }),
    });
    const auth = await r.json().catch(() => ({}));
    if (!r.ok || !auth.access_token) { mostrarErro('login-erro', 'Email ou senha incorretos.'); btn.disabled = false; btn.textContent = 'Entrar'; return; }
    salvarSessao(auth);
    await entrarNaTela(auth);
  } catch (e) {
    mostrarErro('login-erro', 'Falha ao conectar. Tente novamente.');
  }
  btn.disabled = false; btn.textContent = 'Entrar';
}

async function entrarNaTela(auth) {
  // Checa staff ANTES de tentar mostrar qualquer coisa — is_staff_mimba() é
  // SECURITY DEFINER; se vier false, a pessoa está autenticada (tem conta
  // Supabase) mas não é staff Mimba, então nem tentamos buscar leads.
  const rpc = await fetch(`${SUPABASE_URL}/rest/v1/rpc/is_staff_mimba`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${auth.access_token}`, 'Content-Type': 'application/json' },
    body: '{}',
  });
  const ehStaff = await rpc.json().catch(() => false);
  if (!rpc.ok || ehStaff !== true) {
    limparSessao();
    mostrarErro('login-erro', 'Essa conta não tem acesso a esta área.');
    return;
  }
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('tela-admin').style.display = 'block';
  await carregarLeads(auth);
}

async function carregarLeads(auth) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/leads?select=nome,contato,origem,utm_source,utm_medium,utm_campaign,criado_em&order=criado_em.desc`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${auth.access_token}` },
  });
  document.getElementById('carregando').style.display = 'none';
  if (!r.ok) { mostrarErro('acesso-erro', 'Não foi possível carregar os leads.'); return; }
  const leads = await r.json().catch(() => []);
  const seteDias = Date.now() - 7 * 24 * 60 * 60 * 1000;
  document.getElementById('stat-total').textContent = leads.length;
  document.getElementById('stat-7d').textContent = leads.filter(l => new Date(l.criado_em).getTime() >= seteDias).length;
  if (!leads.length) { document.getElementById('vazio').style.display = 'block'; return; }
  const corpo = document.getElementById('leads-body');
  corpo.innerHTML = leads.map(l => `
    <tr>
      <td>${new Date(l.criado_em).toLocaleString('pt-BR')}</td>
      <td>${escapeHtml(l.nome)}</td>
      <td>${escapeHtml(l.contato)}</td>
      <td><span class="tag">${escapeHtml(l.origem || '—')}</span></td>
      <td>${escapeHtml(l.utm_source || '—')}</td>
    </tr>
  `).join('');
  document.getElementById('tabela-leads').style.display = 'table';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function sair() {
  limparSessao();
  location.reload();
}

(async function init() {
  const sessao = lerSessao();
  if (sessao && sessao.access_token) { await entrarNaTela(sessao); }
})();
</script>
</body>
</html>
